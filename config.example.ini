; Copy to config.ini (git-ignored) and fill in. Keys and phrases can also come from the
; environment instead: FLASHIFT_API_KEY, TROCADOR_API_KEY, DRAIN_PASSPHRASE, DRAIN_SECONDPHRASE.

[static]
; Y = run every check and fetch quotes, but create no order and send nothing
test = Y
; amount used for test quotes (ARK)
test_amt = 750
; ARK Core API used to read the wallet and broadcast
node = http://localhost:4003/api
passphrase =
secondphrase = None
convert_from = ark
; ARK address being drained (also used as refund address where supported)
convert_address =
convert_to = usdc
; where the converted coins go (your Polygon address for USDC)
address_to =
; services to ask, comma separated; the best payout wins and the next is tried if one fails
providers = Flashift, Trocador
; Y = convert fixed_amt ARK per run instead of the whole balance (or what's left, if less)
fixed = N
fixed_amt = 0
; Y = skip the run (exit 0) while the amount to send is below min_amt ARK, so the wallet builds up
min = N
min_amt = 0
; ARK to always leave in the wallet (on top of the fee)
keep = 0
; refuse quotes paying less than this many convert_to per ARK (0 = no floor), e.g. 0.10
min_rate = 0
exchange_log = exchange.txt

[flashift]
; https://flashift.app -> Settings -> Get API Key
api_key =
network_from = ark
; USDC network codes: pol (Polygon), base, eth, arb, op, bsc, sol, avaxc
network_to = pol
; floating, fixed or any
rate = floating

[trocador]
; https://trocador.app affiliate program
api_key =
network_from = Mainnet
; USDC network codes: MATIC (Polygon), base, ERC20, Optimism, BEP20, SOL, AVAXC
network_to = MATIC
; floating, fixed or any
rate = floating
; optional: only use exchanges with at least this KYC rating (A = no KYC ... D)
min_kycrating =
