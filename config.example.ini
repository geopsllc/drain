; Copy to config.ini (git-ignored) and fill in. Keys and phrases can also come from the
; environment instead: FLASHIFT_API_KEY, TROCADOR_API_KEY, DRAIN_PASSPHRASE, DRAIN_SECONDPHRASE.

[static]
; Y = only fetch quotes, create no order and send nothing
test = Y
; amount used for test quotes (ARK)
test_amt = 750
; ARK Core API used to read the wallet and broadcast
node = http://localhost:4003/api
passphrase =
secondphrase = None
convert_from = ark
; ARK address being drained (also used as refund address where supported)
convert_address =
convert_to = usdc
; where the converted coins go (your Polygon address for USDC)
address_to =
; services to ask, comma separated; the best payout wins and the next is tried if one fails
providers = Flashift, Trocador
; Y = convert fixed_amt ARK per run instead of the whole balance
fixed = N
fixed_amt = 0
exchange_log = exchange.txt

[flashift]
; https://flashift.app -> Settings -> Get API Key
api_key =
network_from = ark
network_to = pol
; floating, fixed or any
rate = floating

[trocador]
; https://trocador.app affiliate program
api_key =
network_from = Mainnet
network_to = Polygon
; floating, fixed or any
rate = floating
; optional: only use exchanges with at least this KYC rating (A = no KYC ... D)
min_kycrating =
