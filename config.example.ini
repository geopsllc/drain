# Copy to config.ini (git-ignored), fill in, and chmod 600 it. No exchange API keys are needed: swaps go
# through the ARK Exchange Worker. The phrases can also come from the environment instead:
# DRAIN_PASSPHRASE, DRAIN_SECONDPHRASE (and DRAIN_WORKER for the worker URL).

[static]
# Y = run every check and fetch quotes, but create no order and send nothing.
# Test mode quotes fixed_amt if fixed = Y, otherwise test_amt (never the wallet balance)
test = Y

# ARK to quote in test mode when fixed = N (with fixed = Y, test mode quotes fixed_amt)
test_amt = 750

# ARK Core API used to read the wallet and broadcast (public API; or your own node, e.g. http://localhost:4003/api)
node = https://api.ark.io/api

# passphrase of the wallet being drained
passphrase =

# second passphrase, if the wallet has one (None = no second passphrase)
secondphrase = None

# coin being drained (only ark is supported)
convert_from = ark

# ARK address being drained (also used as refund address where supported)
convert_address =

# coin to receive: usdc or usdt
convert_to = usdc

# network to receive it on: polygon, base, ethereum, arbitrum, optimism or bsc (BNB Chain)
# (usdt is not offered on base)
network = polygon

# where the converted coins go: your 0x address on that network
address_to =

# exchange worker that holds the Flashift/Trocador API keys and creates the orders (must be https)
worker = https://xc.geops.net

# services to use, comma separated: Flashift, Trocador. The best payout wins; if an order fails
# drain checks, the next quote is tried (up to 3)
providers = Flashift, Trocador

# Y = convert fixed_amt ARK per run instead of the whole balance (or what's left, if less)
fixed = N

# ARK per run when fixed = Y; also the amount test mode quotes
fixed_amt = 0

# Y = skip the run (prints "Minimum not met", exit 0) while the amount to send is below min_amt
min = N

# minimum ARK to send when min = Y
min_amt = 0

# ARK to always leave in the wallet (on top of the fee)
keep = 0

# refuse quotes paying less than this much USDC or USDT (whichever convert_to is) per ARK, e.g. 0.10
# (0 = no floor)
min_rate = 0

# log of every order created, next to drain.py
exchange_log = exchange.txt
